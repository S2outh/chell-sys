[package]
name = "chell"
version = "8.3.0"
edition = "2024"

[features]
ground = ["dep:erased-serde", "dep:serde", "macros/ground"]

heapless = ["dep:heapless"]
nalgebra = ["dep:nalgebra"]

[dependencies]
macros = { package = "chell-macros", path = "./macros/" }
thiserror = { version = "2.0.21", default-features = false }

# Optional chell values for external libraries
nalgebra = { version = "0.35.0", default-features = false, optional = true }
heapless = { version = "0.9", default-features = false, optional = true }

# ground serialization via serde
erased-serde = { version = "0.4.10", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
serde_cbor = "0.11.2"
